// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // The Health Connect bridge (app/src/main/java/.../HealthConnectPlugin.kt) is in Kotlin.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Capacitor plugins written in Kotlin (local notifications) ask Gradle for a Java 21 toolchain,
// and this machine only has Android Studio's JDK (Java 25). Compile them with the JDK running
// Gradle, still producing Java 21 bytecode. After evaluation, so it wins over the plugin's own setting.
subprojects { project ->
    project.afterEvaluate {
        if (project.extensions.findByName('kotlin') == null) return
        project.java.toolchain.languageVersion = JavaLanguageVersion.of(JavaVersion.current().majorVersion)
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions.jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
